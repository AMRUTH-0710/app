<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fresher Frenzy — merged concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== EDIT THESE TO CHANGE THE WHOLE PALETTE ===== */
    --bg-1: #0c0a10;
    --bg-2: #171021;
    --accent-a: #ff7ce5;   /* gradient stop 1 */
    --accent-b: #7ef9ff;   /* gradient stop 2 */
    --accent-c: #c9a8ff;   /* gradient stop 3 */
    --accent-d: #ffd27e;   /* gradient stop 4 */
    --frame: rgba(255,255,255,.35);
    --text-soft: #c9c2d6;
    --text-bright: #f5f2fb;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg-1); }

  .hero {
    position:relative; overflow:hidden;
    padding:70px 56px 80px;
    background: linear-gradient(165deg,var(--bg-2) 0%,var(--bg-1) 60%);
  }

  /* corner frame, carried from concept 3, softly pulsing */
  .frame { position:absolute; inset:16px; border:1px solid var(--frame); pointer-events:none; opacity:.6; animation: framePulse 4s ease-in-out infinite; }
  .frame::before, .frame::after { content:''; position:absolute; width:30px; height:30px; border:1px solid var(--accent-b); }
  .frame::before { top:-1px; left:-1px; border-right:none; border-bottom:none; }
  .frame::after { bottom:-1px; right:-1px; border-left:none; border-top:none; }
  @keyframes framePulse { 0%,100% { opacity:.35; } 50% { opacity:.75; } }

  /* drifting ambient orb */
  .orb {
    position:absolute; width:320px; height:320px; border-radius:50%;
    right:-80px; top:-100px; filter:blur(50px); opacity:.35;
    background:conic-gradient(from 90deg,var(--accent-a),var(--accent-b),var(--accent-c),var(--accent-d),var(--accent-a));
    animation: drift 9s ease-in-out infinite;
  }
  @keyframes drift { 0%,100% { transform:translate(0,0) scale(1); } 50% { transform:translate(-24px,28px) scale(1.08); } }

  /* scanline texture */
  .hero::before {
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,.02) 3px, transparent 4px);
  }

  /* marquee ticker */
  .ticker { position:relative; overflow:hidden; white-space:nowrap; margin-bottom:34px; opacity:0; animation: fadeIn .6s ease forwards; animation-delay:.1s; }
  .ticker-track { display:inline-block; font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:.25em; text-transform:uppercase; color:var(--accent-b); animation: scroll 14s linear infinite; }
  .ticker-track span { margin-right:40px; }
  @keyframes scroll { from { transform:translateX(0); } to { transform:translateX(-50%); } }

  h1 {
    font-family:'Unbounded',sans-serif; font-weight:900; font-size:78px; line-height:.98; letter-spacing:-.01em;
    color:var(--text-bright);
    opacity:0; transform:translateY(18px);
    animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.25s;
  }
  h1 .grad {
    background: linear-gradient(100deg,var(--accent-a) 0%,var(--accent-b) 30%,var(--accent-c) 55%,var(--accent-d) 80%,var(--accent-a) 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 0 24px rgba(180,120,255,.4));
    animation: sheen 5s linear infinite;
    display:block; font-size:56px; margin-top:4px;
  }
  @keyframes sheen { to { background-position:200% center; } }

  p.desc {
    font-family:'Space Grotesk',sans-serif; color:var(--text-soft); font-size:16px; max-width:460px; margin:24px 0 32px; line-height:1.55;
    opacity:0; animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.4s;
  }

  .btnrow { display:flex; gap:14px; opacity:0; animation: fadeUp .7s cubic-bezier(.16,1,.3,1) forwards; animation-delay:.55s; }
  .btn { position:relative; overflow:hidden; font-family:'Unbounded',sans-serif; font-weight:700; font-size:12px; letter-spacing:.02em; padding:16px 28px; border-radius:10px; text-transform:uppercase; cursor:pointer; transition: transform .2s ease; }
  .btn:hover { transform:translateY(-2px); }
  .btn.primary { background:linear-gradient(90deg,var(--accent-a),var(--accent-b)); color:#160a1e; }
  .btn.primary::after {
    content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-20deg); animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine { 0% { left:-60%; } 40%,100% { left:130%; } }
  .btn.ghost { border:1px solid rgba(255,255,255,.35); color:#fff; backdrop-filter:blur(4px); background:rgba(255,255,255,.03); }

  @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { to { opacity:1; } }
</style>
</head>
<body>

  <div class="hero">
    <div class="orb"></div>
    <div class="frame"></div>

    <div class="ticker">
      <div class="ticker-track">
        <span>NEW FACES</span><span>NEW STORIES</span><span>SAME VIBES</span><span>BATCH 2026</span>
        <span>NEW FACES</span><span>NEW STORIES</span><span>SAME VIBES</span><span>BATCH 2026</span>
      </div>
    </div>

    <h1>FRESHER<span class="grad">FRENZY '26</span></h1>

    <p class="desc">BCom Association presents the freshers' party for batch 2026 — two days, one campus, and an entry pass with your name on it.</p>

    <div class="btnrow">
      <div class="btn primary">Open invitation</div>
      <div class="btn ghost">Get your pass</div>
    </div>
  </div>

</body>
</html>
